<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Sky Azure to Deep Royal Blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24a8ff"/>
      <stop offset="48%" stop-color="#0c6beb"/>
      <stop offset="100%" stop-color="#073a9c"/>
    </linearGradient>

    <!-- Ambient Sky Glow -->
    <radialGradient id="ambient" cx="36%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ffd54f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0c6beb" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Glow & Core -->
    <linearGradient id="sunCore" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fff866"/>
      <stop offset="42%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <!-- Cloud Volume Gradient -->
    <linearGradient id="cloudBody" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#c6deff"/>
    </linearGradient>

    <!-- Cloud Highlight Puffs -->
    <linearGradient id="puffTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="lightning" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffb7a"/>
      <stop offset="35%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>

    <!-- Rain Drops Gradient -->
    <linearGradient id="drop" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#5bebff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>

    <!-- Cloud Soft Shadow -->
    <filter id="cloudDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#021c52" flood-opacity="0.42"/>
    </filter>

    <!-- Lightning Glow -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#ff9900" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icons (Android safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#ambient)"/>

  <!-- WEATHER ARTWORK (Balanced within the 80% safe zone circle) -->
  <g id="artwork">
    <!-- SUN -->
    <g id="sun">
      <!-- Sun Rays -->
      <g stroke="#ffca28" stroke-width="14" stroke-linecap="round" opacity="0.95">
        <line x1="204" y1="94" x2="204" y2="68"/>
        <line x1="128" y1="126" x2="108" y2="106"/>
        <line x1="94" y1="204" x2="68" y2="204"/>
        <line x1="128" y1="282" x2="110" y2="300"/>
        <line x1="280" y1="126" x2="300" y2="106"/>
      </g>
      <!-- Sun Body -->
      <circle cx="204" cy="204" r="70" fill="url(#sunCore)"/>
    </g>

    <!-- CLOUD -->
    <g id="cloud" filter="url(#cloudDepth)">
      <!-- Smooth cloud body -->
      <path d="
        M 198 356
        L 366 356
        A 58 58 0 0 0 408 256
        A 52 52 0 0 0 374 186
        A 78 78 0 0 0 248 176
        A 68 68 0 0 0 148 266
        A 58 58 0 0 0 198 356
        Z"
        fill="url(#cloudBody)"/>

      <!-- Volume Highlights -->
      <ellipse cx="260" cy="200" rx="48" ry="24" fill="url(#puffTop)"/>
      <ellipse cx="352" cy="232" rx="32" ry="17" fill="url(#puffTop)"/>
      <ellipse cx="186" cy="286" rx="24" ry="14" fill="url(#puffTop)"/>
    </g>

    <!-- PRECIPITATION & LIGHTNING -->
    <g id="forecast-elements">
      <!-- Lightning Bolt -->
      <path d="M 248 332 L 298 332 L 264 380 L 306 380 L 226 448 L 246 394 L 212 394 Z"
            fill="url(#lightning)"
            filter="url(#boltGlow)"/>

      <!-- Raindrop 1 -->
      <path d="M 344 372 C 333 390 326 402 326 413 C 326 428 338 440 353 440 C 368 440 380 428 380 413 C 380 402 373 390 362 372 C 358 366 348 366 344 372 Z"
            fill="url(#drop)"/>

      <!-- Raindrop 2 -->
      <path d="M 400 388 C 391 402 386 412 386 421 C 386 432 396 442 408 442 C 420 442 430 432 430 421 C 430 412 425 402 416 388 C 412 383 404 383 400 388 Z"
            fill="url(#drop)"/>
    </g>
  </g>
</svg>
